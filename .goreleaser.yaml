version: 2
project_name: vpn

before:
  hooks:
    - go test ./...

builds:
  - binary: vpn
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    # Без версии в имени — чтобы работала ссылка releases/latest/download/vpn_darwin_arm64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, README.en.md, LICENSE, CHANGELOG.md]

homebrew_casks:
  - name: vpn
    binaries: [vpn]
    homepage: https://github.com/pnnnx/vpn
    description: "Консольный Xray-клиент для macOS: TUI, подписки, VLESS Reality, SSH мимо VPN"
    license: MIT
    directory: Casks
    repository:
      owner: pnnnx
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Без токена (секрет не задан) релиз всё равно выходит, просто без обновления tap
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vpn"]
          end

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Новое
      regexp: '^feat'
      order: 0
    - title: Исправления
      regexp: '^fix'
      order: 1
  filters:
    exclude: ['^docs', '^test', '^ci', '^chore']
